<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc">
  <title id="title">Karan Singh portfolio banner</title>
  <desc id="desc">A light, modern portfolio banner for Karan Singh, an AI and machine-learning enthusiast and full-stack web developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset=".56" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0891B2" stop-opacity=".75"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".92"/>
      <stop offset="1" stop-color="#E2E8F0" stop-opacity=".58"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1180" height="420" rx="24" fill="url(#bg)"/>
  <path d="M0 329C174 254 249 387 424 316S708 230 846 302s224 24 334-61V420H0Z" fill="#0EA5E9" opacity=".1"/>
  <path d="M-30 88C165 7 277 143 431 87S725 14 860 88s204 39 365-64" fill="none" stroke="url(#aurora)" stroke-width="1.5" opacity=".7"/>
  <path d="M-20 119C160 52 281 171 433 119S718 56 850 119s209 35 346-55" fill="none" stroke="#0891B2" stroke-width="1" opacity=".18"/>

  <g fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="68" y="72" font-size="13" letter-spacing="3">KARAN SINGH / PORTFOLIO</text>
    <rect x="68" y="92" width="48" height="3" rx="1.5" fill="#0891B2"/>
    <rect x="122" y="92" width="22" height="3" rx="1.5" fill="#7C3AED"/>
    <rect x="150" y="92" width="12" height="3" rx="1.5" fill="#059669"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="68" y="172" fill="#0F172A" font-size="52" font-weight="700" letter-spacing="-2">Building at the edge</text>
    <text x="68" y="225" fill="#0F172A" font-size="52" font-weight="700" letter-spacing="-2">of web, 3D &amp; AI.</text>
    <text x="70" y="272" fill="#475569" font-size="17">AI &amp; ML enthusiast · Full-stack developer · India</text>
  </g>

  <g transform="translate(68 318)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">
    <rect width="130" height="34" rx="17" fill="#CFFAFE" stroke="#0891B2" stroke-opacity=".55"/>
    <text x="65" y="22" text-anchor="middle" fill="#0E7490">FULL-STACK</text>
    <rect x="142" width="88" height="34" rx="17" fill="#EDE9FE" stroke="#7C3AED" stroke-opacity=".55"/>
    <text x="186" y="22" text-anchor="middle" fill="#6D28D9">3D WEB</text>
    <rect x="242" width="78" height="34" rx="17" fill="#D1FAE5" stroke="#059669" stroke-opacity=".55"/>
    <text x="281" y="22" text-anchor="middle" fill="#047857">AI / ML</text>
  </g>

  <g transform="translate(856 54)">
    <rect width="254" height="312" rx="18" fill="url(#glass)" stroke="#CBD5E1"/>
    <circle cx="31" cy="31" r="6" fill="#0891B2" filter="url(#glow)"/>
    <text x="49" y="36" fill="#334155" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">CREATIVE SYSTEM</text>
    <path d="M38 134C38 88 75 52 122 52s84 36 84 82-37 82-84 82-84-36-84-82Z" fill="none" stroke="#0891B2" stroke-opacity=".48"/>
    <path d="M68 134C68 88 92 52 122 52s54 36 54 82-24 82-54 82-54-36-54-82Z" fill="none" stroke="#7C3AED" stroke-opacity=".55"/>
    <path d="M122 52v164M38 134h168" stroke="#64748B" stroke-opacity=".28"/>
    <circle cx="122" cy="134" r="22" fill="#BAE6FD" stroke="#0891B2" stroke-width="1.5"/>
    <circle cx="122" cy="134" r="7" fill="#0891B2" filter="url(#glow)"/>
    <circle cx="190" cy="94" r="7" fill="#7C3AED"/>
    <circle cx="66" cy="179" r="6" fill="#059669"/>
    <g font-family="ui-monospace, monospace" font-size="11" fill="#64748B">
      <text x="28" y="260">01 / INTERACTION</text>
      <text x="28" y="282">02 / ENGINEERING</text>
      <text x="28" y="304">03 / EXPLORATION</text>
    </g>
    <path d="M195 256h32M195 278h20M195 300h27" stroke="#0891B2" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  </g>

  <rect x="0" y="418" width="1180" height="2" fill="#0891B2" opacity=".78"/>
</svg>

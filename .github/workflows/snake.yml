
name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: KuruHe
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_dots=#2d3343,#0e7490,#0891b2,#22d3ee,#10b981

      - name: Publish the generated SVGs
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
